[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cookingcoder-mcp"
version = "0.1.0"
description = "CookingCoder MCP Server - 把菜谱库变成 LLM 可调用的工具"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=4.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
packages = ["cookingcoder_mcp"]
